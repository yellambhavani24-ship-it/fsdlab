<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<script>
function check(){
  let u=document.f.user.value;
  let p=document.f.pass.value;

  if(u==""||p==""){
    alert("Enter all fields");
    return false;
  }
  if(p.length<6){
    alert("Wrong password");
    return false;
  }
  return true;
}
</script>
</head>

<body>
<h2>Login</h2>
<form name="f" action="login-success.html" onsubmit="return check()">
Username: <input type="text" name="user"><br>
Password: <input type="password" name="pass"><br><br>
<button type="submit">Login</button>
</form>
</body>
</html>
